<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Digital Gullak — small savings, golden goals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17150f"/>
      <stop offset="0.55" stop-color="#0d0d0c"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#ecc677" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ecc677" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2cf"/>
      <stop offset="0.45" stop-color="#f0cd7d"/>
      <stop offset="1" stop-color="#c99a3e"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset="0.35" stop-color="#e8bf68"/>
      <stop offset="0.7" stop-color="#b5832f"/>
      <stop offset="1" stop-color="#6e4c17"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff7d9"/>
      <stop offset="0.5" stop-color="#f0c45a"/>
      <stop offset="1" stop-color="#a8751f"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ecc677" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="338" rx="27" fill="none" stroke="#ecc677" stroke-opacity="0.3"/>

  <!-- Gullak -->
  <g transform="translate(930 46) scale(2.1)">
    <ellipse cx="60" cy="120" rx="38" ry="5" fill="#000" opacity=".55"/>
    <path d="M60 38c-27 0-44 18-44 42 0 21 16 36 44 36s44-15 44-36c0-24-17-42-44-42z" fill="url(#pot)"/>
    <path d="M43 29h34a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4H43a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4z" fill="#c9973f"/>
    <rect x="47" y="52" width="26" height="5.5" rx="2.75" fill="#2a1a06" opacity=".8"/>
    <path d="M22 86c25 9 51 9 76 0" stroke="#fff6dc" stroke-opacity=".35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M31 74c3-12 11-20 22-23" stroke="#fff" stroke-opacity=".55" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="13" r="11" fill="url(#coin)"/>
    <text x="60" y="17.5" text-anchor="middle" font-size="11.5" font-weight="800" fill="#6b4710" font-family="Segoe UI, Helvetica, Arial, sans-serif">₹</text>
  </g>
  <circle cx="880" cy="70" r="9" fill="url(#coin)" opacity=".85"/>
  <circle cx="1180" cy="120" r="6" fill="url(#coin)" opacity=".7"/>
  <circle cx="1150" cy="280" r="4" fill="url(#coin)" opacity=".6"/>

  <!-- Text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="66" width="74" height="26" rx="13" fill="url(#gold)"/>
    <text x="109" y="84" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#1b1406">DEMO</text>
    <text x="72" y="168" font-size="76" font-weight="800" letter-spacing="-2" fill="#f5f0e6">Digital <tspan fill="url(#gold)">Gullak</tspan></text>
    <text x="74" y="214" font-size="27" font-weight="500" fill="#d2c9b7">Small savings, golden goals — in rupees.</text>
    <text x="74" y="262" font-size="18" fill="#9b927f">Goal pockets · Simulated bank-partner ledger · Rewards &amp; games · Built for India 🇮🇳</text>
  </g>
